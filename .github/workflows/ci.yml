name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: requests, POSTGRES_PASSWORD: ci_fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_fixture@localhost:5432/requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python tests/check_assets.py
      - run: node --check appointment.js
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: {version: 11.7.0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.18.0'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
